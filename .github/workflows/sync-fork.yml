name: Sync fork with upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync with upstream
        run: |
          git remote add upstream "https://github.com/botgram/shell-bot.git"
          git fetch upstream
          git checkout master
          git merge "upstream/master" --ff-only
          git push origin master
